[project]
name = "livre-crypto"
version = "0.1.0"
description = "Agents locaux pour la rédaction vérifiée d'un livre de cryptographie"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "fonttools>=4.66.0",
    "huggingface-hub>=1.33.0",
    "mlx-lm[evaluate,train]>=0.31.3",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "rich>=15.0.0",
    "sympy>=1.14.0",
    "typer>=0.27.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livre_crypto_rag"]
